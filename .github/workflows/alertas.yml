name: Alertas do calendário
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Lisbon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock firebase-admin@12
      - run: node alertas.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
